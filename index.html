<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محل إكسسوات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.tailwindcss.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.1.0/css/all.min.css">
</head>
<body>
    <!-- Sticky Navbar -->
    <nav class="fixed top-0 z-10 w-full px-4 py-4 bg-transparent border-b-4 border-gray-100 shadow-sm">
        <div class="container flex justify-end items-center">
            <a class="py-2 text-lg font-medium tracking-tight text-gray-800 hover:text-gray-900 transition duration-200 ease-in-out" href="#">الرئيسية</a>
        </div>
        <div class="container flex justify-end items-center pt-2">
            <img class="w-16 h-16 object-cover" src="https://source.unsplash.com/featured/?محل إكسسوات">
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero min-h-screen bg-white dark:bg-gray-900">
        <div class="container relative p-4">
            <div class="flex flex-col items-center justify-center h-full pb-16">
                <h1 class="text-4xl font-bold text-gray-800 dark:text-white mb-4">محل إكسسوات</h1>
                <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">خدمات متميزة للمدنين</p>
                <button class="bg-orange-500 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded-md inline-block">تبدأ العمل</button>
            </div>
        </div>
    </header>

    <!-- Services Grid -->
    <section class="bg-white dark:bg-gray-800 py-16">
        <div class="container mx-auto p-4">
            <h2 class="text-3xl font-bold text-gray-800 dark:text-white mb-8">الأقسام</h2>
            <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
                <div class="bg-white dark:bg-gray-800 rounded-lg p-8">
                    <i class="fa-regular fa-crown mb-5 text-3xl text-yellow-500"></i>
                    <h3 class="text-2xl font-bold text-gray-800 dark:text-white">خدمة 1</h3>
                    <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">وصف الخدمة</p>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-lg p-8">
                    <i class="fa-regular fa-tools mb-5 text-3xl text-orange-500"></i>
                    <h3 class="text-2xl font-bold text-gray-800 dark:text-white">خدمة 2</h3>
                    <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">وصف الخدمة</p>
                </div>
                <div class="bg-white dark:bg-gray-800 rounded-lg p-8">
                    <i class="fa-regular fa-gift mb-5 text-3xl text-green-500"></i>
                    <h3 class="text-2xl font-bold text-gray-800 dark:text-white">خدمة 3</h3>
                    <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">وصف الخدمة</p>
                </div>
                <div class="bg-white dark:bg-gray-800 mb-4 rounded-lg p-8"></div>
            </div>
        </div>
    </section>

    <!-- WhatsApp CTA -->
    <div class="fixed bottom-0 right-0 m-4">
        <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md inline-block"><i class="fa-brands fa-whatsapp"></i> تواصل معنا</button>
    </div>

    <!-- Contact Section -->
    <section class="bg-white dark:bg-gray-800 py-10">
        <div class="container mx-auto p-4">
            <h2 class="text-3xl font-bold text-gray-800 dark:text-white mb-8">اتصال بنا</h2>
            <form action="#" class="flex flex-col gap-4">
                <input type="text" class="bg-gray-100 dark:bg-gray-800 rounded-lg py-2 pl-4 text-lg focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500" placeholder="الاسم">
                <input type="email" class="bg-gray-100 dark:bg-gray-800 rounded-lg py-2 pl-4 text-lg focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500" placeholder="البريد الإلكتروني">
                <textarea class="bg-gray-100 dark:bg-gray-800 rounded-lg py-2 pl-4 h-20 text-lg focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500" placeholder="الإعتراف"></textarea>
                <button class="bg-orange-500 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded-md inline-block">إرسال</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-800 py-8 text-lg text-gray-400">
        <div class="container mx-auto p-4 flex justify-end items-center">
            <p class="font-bold text-gray-800 dark:text-white">صُنع بذكاء بواسطة براندو</p>
        </div>
    </footer>
</body>
</html>
